name: keep-alive

# Ping /health every 10 minutes so Render free tier never hits its
# ~15-minute idle spin-down. Add repo secret RENDER_HEALTH_URL
# (e.g. https://<service>.onrender.com) in Settings -> Secrets ->
# Actions before enabling. URL stays out of the repo and masked in logs.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret is configured
        run: |
          if [ -z "${{ secrets.RENDER_HEALTH_URL }}" ]; then
            echo "::error::Missing repo secret RENDER_HEALTH_URL (Settings -> Secrets -> Actions)."
            exit 1
          fi

      - name: Ping /health
        run: |
          curl --fail --show-error --silent \
            --max-time 60 --retry 2 --retry-delay 30 \
            "${{ secrets.RENDER_HEALTH_URL }}/health"
