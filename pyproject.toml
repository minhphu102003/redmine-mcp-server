[project]
name = "redmine-mcp-server"
version = "1.1.0"
description = "Turn Redmine into an AI coworker: MCP server plus ready-made agent skills for managers, developers and testers. Works with Claude Desktop, Codex, VS Code and any MCP client."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["redmine", "mcp", "model-context-protocol", "project-management", "ai-agent", "ai-workflow"]
authors = [
    {name = "Kevin Tan", email = "jingzheng.tan@gmail.com"},
    {name = "minhphu102003", email = "minhphu01200@gmail.com"},
]
maintainers = [
    {name = "Kevin Tan", email = "jingzheng.tan@gmail.com"},
    {name = "minhphu102003", email = "minhphu01200@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi[standard]>=0.120.0",
    "httpx>=0.27.0",
    "fastmcp>=3.0.0,<4",
    "python-redmine>=2.5.0",
    "uvicorn>=0.24.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/minhphu102003/redmine-mcp-server"
Repository = "https://github.com/minhphu102003/redmine-mcp-server.git"
Issues = "https://github.com/minhphu102003/redmine-mcp-server/issues"
Changelog = "https://github.com/minhphu102003/redmine-mcp-server/blob/develop/CHANGELOG.md"

[project.scripts]
redmine-mcp-server = "redmine_mcp_server.main:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.28.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.28.1",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
